<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Piyush Singh Bhati</title>
  <script>
    // GitHub Pages SPA redirect trick.
    // When GH Pages gets a 404 for a deep link like /blog/hello-world,
    // it serves this file. We encode the path into the query string and
    // redirect to / so the React Router can pick it up.
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    var redirect = '/?p=' + encodeURIComponent(path + search + hash);
    window.location.replace(redirect);
  </script>
</head>
<body></body>
</html>
