name: Build & Deploy to GitHub Pages

on:
  push:
    branches: ["dep"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        # dist/ now contains:
        #  index.html     → React app entry
        #  assets/        → bundled JS + CSS
        #  *.png/jpg/...  → static images (copied from public/)
        #  audio/         → audio files (copied from public/audio/)
        #  videos/        → video files (copied from public/videos/)

      - name: Copy vanilla index.html as legacy.html
        # Keeps the original standalone index.html accessible at /legacy.html
        run: cp index.html dist/legacy.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
